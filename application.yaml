apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://github.com/OlesiaKh/goit-argo.git
    targetRevision: lesson-7
    path: namespaces/application

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

